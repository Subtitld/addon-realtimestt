name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build per-platform PyInstaller bundles, package each into a release zip
# matching Subtitld's add-on naming convention, and (on tag push) attach them
# to a GitHub Release. The Subtitld catalog (subtitld.github.io/addons-catalog)
# picks the new release up via the GitHub API.
#
# NOTE: manifest.json is placed at the ARCHIVE ROOT — Subtitld's installer
# reads `manifest.json` from the zip root and resolves `executable` relative
# to it (see modules/addons/installer.py:install_from_zip).

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform_label: linux-x86_64
          - os: macos-14   # Apple Silicon; the catalog can't distinguish mac
                           # arch, so we ship one macOS build (arm64) for v0.1.
            platform_label: macos-arm64
          - os: windows-2022
            platform_label: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PortAudio
        # RealtimeSTT pulls PyAudio, which needs PortAudio headers to build on
        # Linux/macOS. We never open a mic (use_microphone=False) but PyAudio
        # must import. Windows PyAudio installs from a prebuilt wheel.
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update && sudo apt-get install -y portaudio19-dev ;;
            macOS) brew install portaudio ;;
          esac

      - name: Install CPU-only torch (Linux)
        # On Linux `pip install torch` pulls the CUDA build + nvidia libs
        # (~3.8 GB bundle, over GitHub's 2 GiB release-asset limit). We only
        # use torch for lightweight VAD — whisper runs on CTranslate2 — so the
        # CPU wheel is plenty and keeps the bundle small. macOS/Windows already
        # default to CPU torch.
        if: runner.os == 'Linux'
        shell: bash
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[build]'

      - name: Build PyInstaller bundle
        shell: bash
        run: pyinstaller pyinstaller.spec --noconfirm

      - name: Verify the STT engine is bundled
        # RealtimeSTT makes faster-whisper an optional extra; if the dependency
        # or PyInstaller collection ever drops it, the add-on modulenotfounds at
        # transcribe time. Fail the build here instead of shipping it.
        shell: bash
        run: |
          for pkg in faster_whisper ctranslate2; do
            if ! find dist/realtimestt-addon -iname "*${pkg}*" | grep -q .; then
              echo "ERROR: ${pkg} missing from the bundle"; exit 1
            fi
          done
          echo "faster_whisper + ctranslate2 present in bundle"

      - name: Stage release archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          rm -rf release-staging
          mkdir -p release-staging/realtimestt-addon
          # PyInstaller --onedir output → folder at the archive root.
          cp -r dist/realtimestt-addon/. release-staging/realtimestt-addon/
          # manifest.json / LICENSE / README at the archive ROOT.
          cp manifest.json LICENSE README.md release-staging/
          archive_name="realtimestt-${version}-${{ matrix.platform_label }}.zip"
          ( cd release-staging && \
            python -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', '.')" "../${archive_name%.zip}" )
          ls -lah "$archive_name"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Compute checksum
        shell: bash
        run: |
          python -c "import hashlib; open('${ARCHIVE_NAME}.sha256','w').write(hashlib.sha256(open('${ARCHIVE_NAME}','rb').read()).hexdigest())"
          cat "${ARCHIVE_NAME}.sha256"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_label }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Flatten layout
        shell: bash
        run: |
          mkdir -p release-files
          find artefacts -type f -name 'realtimestt-*' -exec cp {} release-files/ \;
          ls -lah release-files
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
